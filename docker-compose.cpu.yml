services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./hls_output:/app/hls_output
      - .:/app
      - ./data:/app/data
    restart: unless-stopped
    ports:
      - "8080:8080"
    entrypoint:
      - go
    command:
      - run
      - cmd/api/main.go
    networks:
      - rtsp_network


  file_server:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "6001:6001"
    volumes:
      - ./hls_output:/app/hls_output
    depends_on:
      - api
    networks:
      - rtsp_network
    entrypoint:
      - go
    command:
      - run
      - cmd/file_server/main.go



networks:
  rtsp_network:
    driver: bridge