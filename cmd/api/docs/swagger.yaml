basePath: /
definitions:
  main.GetPipeLineResponse:
    properties:
      bitrate:
        type: integer
      created_at:
        type: string
      hls_url:
        type: string
      id:
        type: integer
      is_active:
        type: boolean
      max_files:
        type: integer
      name:
        type: string
      playlist_length:
        type: integer
      rtsp_url:
        type: string
      target_duration:
        type: integer
      updated_at:
        type: string
      use_gpu:
        type: boolean
    type: object
  main.RTSPInformationRequest:
    properties:
      bitrate:
        type: integer
      max_files:
        type: integer
      name:
        type: string
      playlist_length:
        type: integer
      rtsp_url:
        type: string
      target_duration:
        type: integer
      use_gpu:
        type: boolean
    type: object
  main.responseSchema:
    properties:
      data:
        description: Additional Data
      message:
        description: success, fail
        type: string
      status:
        description: HTTP Status Code
        type: integer
    type: object
info:
  contact: {}
  description: RTSP → HLS 변환 파이프라인 관리 및 상태 조회 API
  title: GStreamer Media Server API
  version: "1.0"
paths:
  /health:
    get:
      description: 서버 상태를 확인합니다
      produces:
      - application/json
      responses:
        "200":
          description: 서버 정상
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Health check
      tags:
      - system
  /pipeline:
    post:
      consumes:
      - application/json
      description: RTSP 정보를 받아 새 파이프라인을 생성하고 DB에 저장합니다
      parameters:
      - description: 새 파이프라인 RTSP 정보 (ID 필드 제외)
        in: body
        name: rtsp
        required: true
        schema:
          $ref: '#/definitions/main.RTSPInformationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 생성 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "400":
          description: 잘못된 요청 본문
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "409":
          description: 파이프라인이 이미 존재함
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: 파이프라인 생성 또는 DB 저장 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Create a new pipeline
      tags:
      - pipeline
    put:
      consumes:
      - application/json
      description: 기존 파이프라인을 새 설정으로 업데이트하고 DB에 반영합니다
      parameters:
      - description: 업데이트할 RTSP 정보 (ID 필드 제외)
        in: body
        name: rtsp
        required: true
        schema:
          $ref: '#/definitions/main.RTSPInformationRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 업데이트 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  $ref: '#/definitions/main.RTSPInformationRequest'
              type: object
        "400":
          description: 잘못된 요청 본문
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: 파이프라인을 찾을 수 없음
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: 파이프라인 업데이트 또는 DB 반영 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Update a pipeline
      tags:
      - pipeline
  /pipeline/{streamName}:
    delete:
      description: streamName 파이프라인을 정지하고 삭제한 후 DB에서도 하드 삭제합니다
      parameters:
      - description: 삭제할 파이프라인 이름
        in: path
        name: streamName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 삭제 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: 파이프라인 삭제 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Delete a pipeline
      tags:
      - pipeline
    get:
      description: streamName에 해당하는 파이프라인 정보를 DB에서 조회하여 반환합니다
      parameters:
      - description: 파이프라인 이름
        in: path
        name: streamName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  $ref: '#/definitions/main.GetPipeLineResponse'
              type: object
        "404":
          description: 파이프라인을 찾을 수 없음
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Get a pipeline by name
      tags:
      - pipeline
  /pipeline/{streamName}/start:
    put:
      description: streamName 파이프라인을 실행 상태로 변경하고 DB에 상태를 업데이트합니다
      parameters:
      - description: 시작할 파이프라인 이름
        in: path
        name: streamName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 시작 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: 파이프라인 시작 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Start a pipeline
      tags:
      - pipeline
  /pipeline/{streamName}/status:
    get:
      description: 'streamName 파이프라인의 실시간 상태 정보를 반환합니다 (TODO: 구현 예정)'
      parameters:
      - description: 파이프라인 이름
        in: path
        name: streamName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 상태 조회
          schema:
            $ref: '#/definitions/main.responseSchema'
      summary: Get pipeline status by name
      tags:
      - pipeline
  /pipeline/{streamName}/stop:
    put:
      description: streamName 파이프라인을 정지 상태로 변경하고 DB에 상태를 업데이트합니다
      parameters:
      - description: 정지할 파이프라인 이름
        in: path
        name: streamName
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: 파이프라인 정지 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: 파이프라인 정지 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Stop a pipeline
      tags:
      - pipeline
  /pipeline/active/all:
    get:
      description: 동작중인 모든 활성 파이프라인 정보를 조회하여 GetPipeLineResponse 배열로 반환합니다
      produces:
      - application/json
      responses:
        "200":
          description: 활성 파이프라인 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.GetPipeLineResponse'
                  type: array
              type: object
      summary: Get all active pipelines
      tags:
      - pipeline
  /pipeline/all:
    delete:
      description: 모든 파이프라인을 정리하고 DB에서도 모두 삭제합니다
      produces:
      - application/json
      responses:
        "200":
          description: 모든 파이프라인 삭제 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
        "404":
          description: 파이프라인 삭제 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Delete all pipelines
      tags:
      - pipeline
    get:
      description: 모든 파이프라인 설정 정보를 DB에서 조회하여 GetPipeLineResponse 배열로 반환합니다
      produces:
      - application/json
      responses:
        "200":
          description: 모든 파이프라인 조회 성공
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/main.GetPipeLineResponse'
                  type: array
              type: object
        "404":
          description: 파이프라인 조회 실패
          schema:
            allOf:
            - $ref: '#/definitions/main.responseSchema'
            - properties:
                data:
                  type: string
              type: object
      summary: Get all pipelines
      tags:
      - pipeline
schemes:
- http
swagger: "2.0"
